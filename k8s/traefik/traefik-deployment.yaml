apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik-ingress-controller
      containers:
      - name: traefik
        image: traefik:v3.6
        args:
          - --api.dashboard=false
          - --api.insecure=false
          - --providers.kubernetescrd
          - --providers.kubernetesingress
          - --entrypoints.web.address=:80
          - --entrypoints.websecure.address=:443
        ports:
          - name: web
            containerPort: 80
            hostPort: 8080        
          - name: websecure
            containerPort: 443
            hostPort: 8443